name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cross-compilation SDKs are version-locked to the toolchain that produced them. Keep these in step
  # with the Swift release used by the WASM, musl, embedded and lint jobs.
  SWIFT_SDK_VERSION: "6.3.2"

jobs:
  macos:
    name: macOS (test, coverage)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test with coverage
        run: swift test --enable-code-coverage
      - name: Enforce coverage of reachable code
        # All reachable code is covered; the only permitted gaps are `precondition` failure paths
        # (process traps), which cannot be exercised without aborting.
        run: |
          BIN=$(swift build --show-bin-path)
          XCTEST=$(find "$BIN" -name '*.xctest' -type d | head -1)
          EXEC="$XCTEST/Contents/MacOS/$(basename "$XCTEST" .xctest)"
          PROF=$(find "$BIN" -name 'default.profdata' | head -1)
          xcrun llvm-cov export "$EXEC" -instr-profile "$PROF" \
            -ignore-filename-regex='Tests|\.build' -format lcov > coverage.lcov
          xcrun llvm-cov report "$EXEC" -instr-profile "$PROF" \
            -ignore-filename-regex='Tests|\.build' --show-functions=false
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  linux:
    name: Linux (test)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test --parallel

  ios:
    name: iOS Simulator (test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test on iOS Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available 'iPhone' | grep -Eo 'iPhone [0-9]+' | tail -1)
          xcodebuild test \
            -scheme SwiftParsing-Package \
            -destination "platform=iOS Simulator,name=${DEVICE:-iPhone 16}" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

  windows:
    name: Windows (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.3.0
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      # --force-resolved-versions pins to the committed Package.resolved revisions; some Windows
      # git builds cannot peel a dependency's version tag to its commit ("Needed a single revision").
      - name: Build
        run: swift build --force-resolved-versions
      - name: Test
        run: swift test --force-resolved-versions

  wasm:
    name: WebAssembly (test under WasmKit)
    runs-on: ubuntu-24.04
    container: swift:${{ env.SWIFT_SDK_VERSION }}-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install WebAssembly SDK
        run: |
          swift sdk install \
            "https://download.swift.org/swift-${SWIFT_SDK_VERSION}-release/wasm-sdk/swift-${SWIFT_SDK_VERSION}-RELEASE/swift-${SWIFT_SDK_VERSION}-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
      - name: Build for WebAssembly
        # The whole package, including the CLI executable, cross-compiles to wasm32-wasi.
        run: swift build --swift-sdk "swift-${SWIFT_SDK_VERSION}-RELEASE_wasm"
      - name: Test on WebAssembly
        # Run the library test suites under the WasmKit runtime bundled with the toolchain. The
        # executable's test target is excluded because an executable cannot be @testable-imported when
        # cross-compiling.
        env:
          EXCLUDE_EXECUTABLE_TESTS: "1"
        run: EXCLUDE_EXECUTABLE_TESTS=1 swift test --swift-sdk "swift-${SWIFT_SDK_VERSION}-RELEASE_wasm"

  musl:
    name: Static Linux musl (build)
    runs-on: ubuntu-24.04
    container: swift:${{ env.SWIFT_SDK_VERSION }}-noble
    strategy:
      matrix:
        triple: [x86_64-swift-linux-musl, aarch64-swift-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - name: Install Static Linux SDK
        run: |
          swift sdk install \
            "https://download.swift.org/swift-${SWIFT_SDK_VERSION}-release/static-sdk/swift-${SWIFT_SDK_VERSION}-RELEASE/swift-${SWIFT_SDK_VERSION}-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz" \
            --checksum 3fd798bef6f4408f1ea5a6f94ce4d4052830c4326ab85ebc04f983f01b3da407
      - name: Build as a fully static musl binary
        # A compile gate: the Static Linux SDK does not ship swift-testing, so the suite cannot be run
        # there. Test execution is covered by the Linux, macOS, Windows and WebAssembly jobs.
        run: swift build --swift-sdk ${{ matrix.triple }}

  embedded:
    name: Embedded compile gate
    runs-on: ubuntu-24.04
    container: swift:${{ env.SWIFT_SDK_VERSION }}-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Embedded WebAssembly SDK
        run: |
          swift sdk install \
            "https://download.swift.org/swift-${SWIFT_SDK_VERSION}-release/wasm-sdk/swift-${SWIFT_SDK_VERSION}-RELEASE/swift-${SWIFT_SDK_VERSION}-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum a61f0584c93283589f8b2f42db05c1f9a182b506c2957271402992655591dd7c
      - name: Compile ParsingCore for Embedded Swift
        # Only ParsingCore targets the Embedded Swift subset (the overlay modules use Foundation). The
        # host build already enforces the EmbeddedRestrictions diagnostic; this proves the core links
        # for a real embedded target.
        run: swift build --swift-sdk "swift-${SWIFT_SDK_VERSION}-RELEASE_wasm-embedded" --target ParsingCore

  lint:
    name: swift-format lint
    runs-on: ubuntu-24.04
    # Pinned to a fixed toolchain so the swift-format version (and therefore its rule set) is
    # reproducible, rather than tracking whatever the macOS runner's Xcode ships.
    container: swift:${{ env.SWIFT_SDK_VERSION }}-noble
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        # The .docc tutorial code listings are illustrative snippets, not API, so they are excluded.
        run: |
          find Sources -name '*.swift' -not -path '*/*.docc/*' -print0 \
            | xargs -0 swift format lint --strict

  docs:
    name: Documentation quality gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build documentation with warnings as errors
        # The doc plugins are gated behind DOCUMENTATION so normal builds skip their heavy graph.
        env:
          DOCUMENTATION: "1"
        run: |
          DOCUMENTATION=1 swift package --allow-writing-to-directory ./docs-ci \
            generate-documentation --enable-experimental-combined-documentation \
            --warnings-as-errors --output-path ./docs-ci \
            --target ParsingCore --target Parsing --target ParsingDSL \
            --target GrammarImport --target RecursiveDescent

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-24.04
    container: swift:${{ env.SWIFT_SDK_VERSION }}-noble
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Install jemalloc
        run: apt-get update && apt-get install -y libjemalloc-dev
      - name: Run benchmarks
        env:
          BENCHMARK: "1"
        run: BENCHMARK=1 swift package benchmark --no-progress
